name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test tests/Auth/testing-auth.spec.ts --project=chromium
      continue-on-error: true
    - name: Get Allure history
      # Fetches previous run histories to populate trend charts in the report
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Generate Allure Report
      uses: simple-elf/allure-report-action@v1.11
      if: always()
      with:
        allure_results: allure-results
        allure_history: allure-history
        keep_reports: 2 # Keeps the last 2 test run reports

    - name: Deploy Allure Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history
      env: # Injecting your specific environment variables
        TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        TEST_USERNAME_COOKIE: ${{ secrets.TEST_USERNAME_COOKIE }}
        TEST_VALUE_COOKIE: ${{ secrets.TEST_VALUE_COOKIE }}
